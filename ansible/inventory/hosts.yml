# Sample inventory. Replace IPs/hostnames with your actual VMs before running.
#
# Naming convention: short host name should match the Fabric peer/orderer name
# without the domain, so the role can derive identities consistently.

all:
  vars:
    fabric_version: "2.5.7"
    fabric_ca_version: "1.5.7"
    domain_root: "hephaestus.id"
    consortium_orgs:
      - { name: BCA,     mspid: BCAMSP,     domain: bca.hephaestus.id }
      - { name: Mandiri, mspid: MandiriMSP, domain: mandiri.hephaestus.id }
      - { name: BRI,     mspid: BRIMSP,     domain: bri.hephaestus.id }
      - { name: BNI,     mspid: BNIMSP,     domain: bni.hephaestus.id }
      - { name: CIMB,    mspid: CIMBMSP,    domain: cimb.hephaestus.id }

  children:

    orderers:
      hosts:
        orderer1.bi.hephaestus.id: { ansible_host: 10.0.0.11, msp_id: BIMSP }
        orderer2.bi.hephaestus.id: { ansible_host: 10.0.0.12, msp_id: BIMSP }
        orderer3.bi.hephaestus.id: { ansible_host: 10.0.0.13, msp_id: BIMSP }

    bank_peers:
      hosts:
        peer0.bca.hephaestus.id:     { ansible_host: 10.0.1.10, org: BCA,     msp_id: BCAMSP }
        peer0.mandiri.hephaestus.id: { ansible_host: 10.0.1.11, org: Mandiri, msp_id: MandiriMSP }
        peer0.bri.hephaestus.id:     { ansible_host: 10.0.1.12, org: BRI,     msp_id: BRIMSP }
        peer0.bni.hephaestus.id:     { ansible_host: 10.0.1.13, org: BNI,     msp_id: BNIMSP }
        peer0.cimb.hephaestus.id:    { ansible_host: 10.0.1.14, org: CIMB,    msp_id: CIMBMSP }

    observers:
      hosts:
        peer0.ojk.hephaestus.id: { ansible_host: 10.0.2.10, org: OJK, msp_id: OJKMSP }

    ca:
      hosts:
        ca.bi.hephaestus.id:      { ansible_host: 10.0.0.20, org: BankIndonesia }
        ca.bca.hephaestus.id:     { ansible_host: 10.0.1.20, org: BCA }
        ca.mandiri.hephaestus.id: { ansible_host: 10.0.1.21, org: Mandiri }
        ca.bri.hephaestus.id:     { ansible_host: 10.0.1.22, org: BRI }
        ca.bni.hephaestus.id:     { ansible_host: 10.0.1.23, org: BNI }
        ca.cimb.hephaestus.id:    { ansible_host: 10.0.1.24, org: CIMB }
        ca.ojk.hephaestus.id:     { ansible_host: 10.0.2.20, org: OJK }
